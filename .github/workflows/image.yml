name: Build image

# Publishes ghcr.io/<owner>/sonarr-pack-updater for amd64 and arm64.
#   - on every push to main that touches the script or its build;
#   - every Monday, so the image picks up Python fixes;
#   - by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - pack_updater.py
      - Dockerfile
      - tests/**
      - .github/workflows/image.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sonarr-pack-updater

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: sonarr-pack-updater:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One pass against a fake Sonarr: exactly the expected grab and queue
      # cleanup, and nothing for releases that must be left alone.
      - name: Smoke test
        run: |
          python3 tests/mock_sonarr.py 2> mock.log &
          sleep 1
          mkdir -m 777 data
          docker run --rm --network host -u 1000:1000 -v "$PWD/data:/data" \
            -e SONARR_URL=http://127.0.0.1:18989 -e SONARR_API_KEY=testkey \
            -e RADARR_URL=http://127.0.0.1:17878 -e RADARR_API_KEY=testkey \
            -e RUN_ONCE=true -e PAUSE_BETWEEN_SEARCHES=0 \
            sonarr-pack-updater:test | tee run.log
          cat mock.log
          grep -q 'Отправлено на скачивание: Always Sunny S18' run.log
          grep -q 'POST /api/v3/release {"guid": "https://tracker/topic?t=111"' mock.log
          grep -q 'POST /api/v3/release {"guid": "https://tracker/topic?t=444", "indexerId": 5, "seriesId": 26}' mock.log
          grep -q 'POST /api/v3/release {"guid": "https://tracker/topic?t=888"' mock.log
          [ "$(grep -c '^POST' mock.log)" = 3 ] || { echo "expected exactly three grabs"; exit 1; }
          grep -q 'RADARR POST /api/v3/command {"name": "MoviesSearch", "movieIds": \[50\]}' mock.log
          [ "$(grep -c '^RADARR' mock.log)" = 1 ] || { echo "expected exactly one Radarr search"; exit 1; }
          grep -q 'DELETE /api/v3/queue/bulk.*removeFromClient=false.*\[101, 102, 103\]' mock.log
          [ "$(grep -c '^DELETE' mock.log)" = 1 ] || { echo "expected exactly one queue cleanup"; exit 1; }
          test -s data/state.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
